services:
  soutubot:
    build:
      context: ..
      dockerfile: proxy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SOUTUBOT_TOKEN: ${SOUTUBOT_TOKEN:-}
      SOUTUBOT_BROWSER_PROXY: ${SOUTUBOT_BROWSER_PROXY:-}
    volumes:
      - browser-data:/data
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8787/healthz', headers={'Authorization':'Bearer '+os.environ.get('SOUTUBOT_TOKEN','')}); urllib.request.urlopen(r, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - imagesearch

volumes:
  browser-data:

networks:
  imagesearch:
    name: astrbot-imagesearch
